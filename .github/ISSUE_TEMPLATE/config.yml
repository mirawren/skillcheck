blank_issues_enabled: false
contact_links:
  - name: Read the documentation
    url: https://mirawren.github.io/skillcheck/
    about: Start with the quick install, feature guide, and links to every reference.
  - name: Propose a rule from the backlog
    url: https://github.com/mirawren/skillcheck/blob/main/docs/GOOD_FIRST_RULES.md
    about: A list of checks that are ready to be written, each one a small PR.
  - name: Why is my skill not triggering?
    url: https://github.com/mirawren/skillcheck/blob/main/docs/rules.md#when-to-use
    about: Start with `npx skillcheck why "<the request that should reach it>"`.
  - name: Add your language
    url: https://github.com/mirawren/skillcheck/blob/main/CONTRIBUTING.md#add-your-language
    about: One self-contained file, no dependencies. Nobody else can do it for you.
  - name: Report a security vulnerability
    url: https://github.com/mirawren/skillcheck/security/advisories/new
    about: Please report vulnerabilities privately, not in a public issue.
