name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          # skillcheck writes files (--fix, init) and resolves paths, so it gets
          # exercised on Windows and macOS too — path handling is where a linter
          # quietly breaks for half its users.
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # The Action's shell can't be covered by vitest, and macOS runners still
      # ship bash 3.2 — where an empty array under `set -u` aborts the step.
      # This is the only job that would ever see that.
      - name: The Action passes its arguments correctly
        if: runner.os != 'Windows'
        run: npm run test:action
      - name: Rule reference matches the rules
        run: npm run docs:check
      # Every console block in the docs is re-run and compared. The README once
      # shipped a `why` example whose percentages had drifted from the ranking —
      # a fabricated-looking screenshot in the one place a measurement tool
      # cannot afford one.
      - name: Documented examples match real output
        run: npm run check:examples
      - name: skillcheck passes its own rules
        run: npm run selfcheck

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: GitHub workflow files parse cleanly
        run: npm run check:workflows

      - name: Release major tag advances monotonically
        run: npm run test:release

      - name: The good fixture passes clean
        run: (cd tests/fixtures/good && node ../../../dist/bin.js .)

      - name: The bad fixture fails
        run: |
          if (cd tests/fixtures/bad && node ../../../dist/bin.js .); then
            echo "expected a non-zero exit on the bad fixture" >&2
            exit 1
          fi

      - name: Trigger scenarios run
        run: (cd tests/fixtures/good && node ../../../dist/bin.js test . --scenarios skillcheck.scenarios.yaml)

      # A context file's failures are the ones nobody sees: the agent reads a
      # dead pointer and carries on. The fixture holds one dead `@import`, one
      # dead link and one leftover marker, and all three have to be named.
      - name: A context file's dead pointers are reported
        run: |
          set -euo pipefail
          out=$( (cd tests/fixtures/context && node ../../../dist/bin.js .) || true)
          echo "$out"
          for expected in "imports \`docs/conventions.md\`" "links to \`docs/architecture.md\`" "TODO/FIXME marker"; do
            case "$out" in
              *"$expected"*) ;;
              *) echo "context check did not report: $expected" >&2; exit 1 ;;
            esac
          done

      - name: budget separates always-on context from what a skill adds
        run: |
          set -euo pipefail
          out=$(cd tests/fixtures/context && node ../../../dist/bin.js budget . --format json)
          echo "$out"
          node -e "
            const b = JSON.parse(process.argv[1]);
            if (b.alwaysTotal <= 0) throw new Error('no always-on cost reported');
            if (b.onActivation.length !== 4) throw new Error('expected four skill bodies');
            if (b.always.length !== 2) throw new Error('expected descriptions plus one context file');
          " "$out"

      # The multilingual path is the one most likely to break silently: nothing
      # in an English-only test run touches script segmentation, and a
      # regression there reports confident nonsense rather than failing. So the
      # end-to-end behaviour is asserted on real non-Latin text.
      - name: Skills outside English are read, not deleted
        run: |
          set -euo pipefail
          out=$(cd tests/fixtures/multilingual && node ../../../dist/bin.js languages .)
          echo "$out"
          for expected in "English" "Japanese (日本語)" "Chinese (中文)"; do
            case "$out" in
              *"$expected"*) ;;
              *) echo "languages did not report $expected" >&2; exit 1 ;;
            esac
          done

      - name: A skill unreachable from the repo's other languages is reported
        run: |
          set -euo pipefail
          # The Chinese skill names no format or product, so no request in
          # English or Japanese shares a single term with it.
          out=$(cd tests/fixtures/multilingual && node ../../../dist/bin.js .)
          echo "$out"
          case "$out" in
            *cross-language-trigger*) ;;
            *) echo "cross-language-trigger did not fire on the multilingual fixture" >&2; exit 1 ;;
          esac
          # …while the Japanese one anchors on "PDF" and must stay clean.
          case "$out" in
            *gijiroku*) echo "gijiroku should not have been reported" >&2; exit 1 ;;
            *) ;;
          esac

      - name: Every output format is machine-valid
        run: |
          (cd tests/fixtures/bad && node ../../../dist/bin.js . --format json)  > /tmp/out.json  || true
          (cd tests/fixtures/bad && node ../../../dist/bin.js . --format sarif) > /tmp/out.sarif || true
          (cd tests/fixtures/good && node ../../../dist/bin.js . --format badge) > /tmp/out.badge
          node -e "JSON.parse(require('fs').readFileSync('/tmp/out.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('/tmp/out.sarif','utf8'))"
          node -e "const b=JSON.parse(require('fs').readFileSync('/tmp/out.badge','utf8')); if(b.schemaVersion!==1) process.exit(1)"

      - name: The published package installs and runs
        run: |
          npm pack --silent
          npm install --no-save ./skillcheck-*.tgz
          ./node_modules/.bin/skillcheck --version
          (cd tests/fixtures/good && ../../../node_modules/.bin/skillcheck .)
