name: "skillcheck"
description: "Activation preflight for agent skills — lint + trigger checks for SKILL.md and Claude Code plugins in 24 languages, so a skill that won't get picked fails the PR instead of shipping"
author: "skillcheck contributors"
branding:
  icon: "check-circle"
  color: "orange"

inputs:
  path:
    description: "File or directory to scan (space-separated for several)"
    required: false
    default: "."
  format:
    description: "Lint output format: github, pretty, json, sarif, markdown, or badge. Trigger/diff reports use github when sarif or badge is selected."
    required: false
    default: "github"
  config:
    description: "Path to a skillcheck.config.json (default: auto-discovered)"
    required: false
    default: ""
  baseline:
    description: "Baseline file of accepted findings (default: .skillcheck-baseline.json if present)"
    required: false
    default: ""
  max-warnings:
    description: "Fail when warnings exceed this number (default: unlimited)"
    required: false
    default: ""
  fix:
    description: "Apply safe automatic fixes before reporting (leaves the working tree dirty for a follow-up commit step)"
    required: false
    default: "false"
  summary:
    description: "Write a markdown report to the job summary"
    required: false
    default: "true"
  scenarios:
    description: "Also run trigger scenarios: auto (only if a scenarios file exists), true, or false"
    required: false
    default: "auto"
  diff:
    description: >-
      Git ref to compare activation against, e.g. ${{ github.event.pull_request.base.sha }}.
      Reports regressed scenario contracts and requests that changed hands unexpectedly.
      Empty disables it. Requires full history — set `fetch-depth: 0` on actions/checkout.
    required: false
    default: ""
  version:
    description: "skillcheck version to run (npm dist-tag or semver)"
    required: false
    # Keep this exact version aligned with package.json. An immutable Action
    # tag must never begin running newer npm code after it was published.
    default: "1.0.1"

outputs:
  score:
    description: "Skill health score, 0-100"
    value: ${{ steps.skillcheck.outputs.score }}
  grade:
    description: "Letter grade, A-F"
    value: ${{ steps.skillcheck.outputs.grade }}
  errors:
    description: "Number of errors reported"
    value: ${{ steps.skillcheck.outputs.errors }}
  warnings:
    description: "Number of warnings reported"
    value: ${{ steps.skillcheck.outputs.warnings }}
  skills:
    description: "Number of skills scanned"
    value: ${{ steps.skillcheck.outputs.skills }}

runs:
  using: "composite"
  steps:
    - name: Set up a supported Node.js runtime
      uses: actions/setup-node@v6
      with:
        node-version: "20"
        package-manager-cache: false

    - name: Run skillcheck
      id: skillcheck
      shell: bash
      env:
        SKILLCHECK_VERSION: ${{ inputs.version }}
        SKILLCHECK_PATH: ${{ inputs.path }}
        SKILLCHECK_FORMAT: ${{ inputs.format }}
        SKILLCHECK_CONFIG: ${{ inputs.config }}
        SKILLCHECK_BASELINE: ${{ inputs.baseline }}
        SKILLCHECK_MAX_WARNINGS: ${{ inputs.max-warnings }}
        SKILLCHECK_FIX: ${{ inputs.fix }}
        SKILLCHECK_SUMMARY: ${{ inputs.summary }}
      run: |
        set -euo pipefail
        args=()
        [ -n "$SKILLCHECK_MAX_WARNINGS" ] && args+=(--max-warnings "$SKILLCHECK_MAX_WARNINGS")
        [ -n "$SKILLCHECK_CONFIG" ] && args+=(--config "$SKILLCHECK_CONFIG")
        [ -n "$SKILLCHECK_BASELINE" ] && args+=(--baseline "$SKILLCHECK_BASELINE")
        [ "$SKILLCHECK_FIX" = "true" ] && args+=(--fix)
        [ "$SKILLCHECK_SUMMARY" = "true" ] && args+=(--summary)
        # `${args[@]+"${args[@]}"}`, not `"${args[@]}"`: macOS runners still ship
        # bash 3.2, where expanding an *empty* array under `set -u` aborts with
        # "unbound variable" — so a run that passed none of the optional inputs
        # above would die before skillcheck started. This form expands to zero
        # words when empty and to correctly quoted ones when not, on both 3.2
        # and 5.x. $SKILLCHECK_PATH stays unquoted on purpose: `path` documents
        # that it accepts several space-separated paths.
        npx --yes "skillcheck@${SKILLCHECK_VERSION}" $SKILLCHECK_PATH \
          --format "$SKILLCHECK_FORMAT" ${args[@]+"${args[@]}"}

    # Trigger scenarios are a separate concern from linting: they answer "does
    # this request still reach this skill?" and only run when the repo keeps a
    # scenarios file.
    - name: Run trigger scenarios
      shell: bash
      if: >-
        always() && !cancelled() &&
        (inputs.scenarios == 'true' ||
         (inputs.scenarios == 'auto' &&
          hashFiles('skillcheck.scenarios.yaml', 'skillcheck.scenarios.yml') != ''))
      env:
        SKILLCHECK_VERSION: ${{ inputs.version }}
        SKILLCHECK_PATH: ${{ inputs.path }}
        SKILLCHECK_FORMAT: ${{ inputs.format }}
        SKILLCHECK_CONFIG: ${{ inputs.config }}
        SKILLCHECK_SUMMARY: ${{ inputs.summary }}
      run: |
        set -euo pipefail
        # `config` decides which skills are in scope (its `ignore` patterns), so
        # the scenarios have to see the same set the check step did — otherwise
        # a scenario resolves against skills the lint step ignored.
        args=()
        [ -n "$SKILLCHECK_CONFIG" ] && args+=(--config "$SKILLCHECK_CONFIG")
        [ "$SKILLCHECK_SUMMARY" = "true" ] && args+=(--summary)
        report_format="$SKILLCHECK_FORMAT"
        case "$report_format" in sarif|badge) report_format=github ;; esac
        npx --yes "skillcheck@${SKILLCHECK_VERSION}" test $SKILLCHECK_PATH \
          --format "$report_format" ${args[@]+"${args[@]}"}

    # Activation drift: the one question a pull request raises that no other
    # check can answer, because the outcome isn't written in either revision of
    # any file — it only exists in the comparison. Stable scenario contracts
    # fail only when they regress; repairs and allowed movement stay green.
    - name: Compare activation against the base revision
      shell: bash
      if: always() && !cancelled() && inputs.diff != ''
      env:
        SKILLCHECK_VERSION: ${{ inputs.version }}
        SKILLCHECK_PATH: ${{ inputs.path }}
        SKILLCHECK_FORMAT: ${{ inputs.format }}
        SKILLCHECK_CONFIG: ${{ inputs.config }}
        SKILLCHECK_DIFF: ${{ inputs.diff }}
        SKILLCHECK_SUMMARY: ${{ inputs.summary }}
      run: |
        set -euo pipefail
        args=()
        [ -n "$SKILLCHECK_CONFIG" ] && args+=(--config "$SKILLCHECK_CONFIG")
        [ "$SKILLCHECK_SUMMARY" = "true" ] && args+=(--summary)
        report_format="$SKILLCHECK_FORMAT"
        case "$report_format" in sarif|badge) report_format=github ;; esac
        npx --yes "skillcheck@${SKILLCHECK_VERSION}" diff "$SKILLCHECK_DIFF" $SKILLCHECK_PATH \
          --format "$report_format" ${args[@]+"${args[@]}"}
